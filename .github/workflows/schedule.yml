
name: Daily Fashion Deals

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scrape-and-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Install Playwright Chromium
        run: uv run playwright install --with-deps chromium

      - name: Scrape sale products
        run: uv run python store_scraper.py

      - name: Generate HTML report
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: uv run python daily_deals.py

      - name: Save report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-designer-deals
          path: daily_deals.html
          if-no-files-found: error
          retention-days: 14
